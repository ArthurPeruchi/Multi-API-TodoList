<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi API TodoList</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <section id="authScreen" class="auth-screen">
        <div class="auth-card">
            <h1 id="authTitle">Entrar</h1>
            <p id="authDescription">Acesse sua lista de tarefas.</p>

            <form id="authForm">
                <div id="nameGroup" class="hidden">
                    <label for="authName">Nome</label>
                    <input
                        type="text"
                        id="authName"
                        autocomplete="name"
                        placeholder="Seu nome"
                    >
                </div>

                <div>
                    <label for="authEmail">E-mail</label>
                    <input
                        type="email"
                        id="authEmail"
                        autocomplete="email"
                        placeholder="seu@email.com"
                        required
                    >
                </div>

                <div>
                    <label for="authPassword">Senha</label>
                    <input
                        type="password"
                        id="authPassword"
                        autocomplete="current-password"
                        placeholder="Sua senha"
                        required
                    >
                </div>

                <button type="submit" id="authSubmit">
                    Entrar
                </button>
            </form>

            <p id="authMessage" role="status"></p>

            <button type="button" id="authToggle" class="auth-toggle">
                Não tem conta? Cadastre-se
            </button>
        </div>
    </section>

    <main id="todoScreen" class="hidden">
        <div class="container">

            <h1>Multi API TodoList</h1>

            <div class="card">
                <h2>Nova Tarefa</h2>

                <form id="todoForm">
                    <input
                        type="text"
                        id="title"
                        placeholder="Título da tarefa"
                        required
                    >

                    <button type="submit">Adicionar</button>
                </form>
            </div>

            <div class="card">
                <h2>Lista de Tarefas</h2>
                <ul id="todoList"></ul>
            </div>

            <div class="card">
                <h2>Estatísticas</h2>
                <p>Total: <span id="total">0</span></p>
                <p>Concluídas: <span id="completed">0</span></p>
            </div>

            <button type="button" id="logoutButton">
                Sair
            </button>

        </div>
    </main>

    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/app.js"></script>

</body>
</html>
